<!DOCTYPE html>
<!-- FILE:  tjs-kitchen-site/events.html
     tjs-kitchen-site/
     ├── events.html   <-- THIS FILE (calendar + "Coming up"; intro line set in the admin)
     └── assets/
         ├── site.js
         └── style.css -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events | TJ's Kitchen</title>
  <meta name="description" content="Upcoming events at TJ's Kitchen, Camarillo Springs Golf Course.">
  <meta property="og:title" content="Events | TJ's Kitchen">
  <meta property="og:description" content="Upcoming events at TJ's Kitchen, Camarillo Springs Golf Course.">
  <meta property="og:image" content="/assets/logo.png">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="/assets/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/site.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/"><img src="/assets/logo.png" alt="TJ's Kitchen logo"><span>TJ's Kitchen</span></a>
      <button class="menu-toggle" aria-label="Open menu">☰</button>
      <nav class="nav">
        <a href="/">Home</a>
        <a href="/menu">Menu</a>
        <a href="/about">About</a>
        <a href="/events" class="active" aria-current="page">Events</a>
        <a href="/contact">Contact</a>
        <a class="btn btn-sm" data-order-link href="https://order.tjskitchenvc.com">Order Online</a>
      </nav>
    </div>
  </header>

  <main>
    <!-- Events (Nov 2026). Managed in the admin portal -> Calendar; this
         page reads them live (assets/site.js -> initEvents). -->
    <section class="section" style="padding-bottom:24px">
      <div class="wrap">
        <div class="eyebrow">What's on</div>
        <h1>Events</h1>
        <p class="lead" style="margin-top:10px" data-events-intro>Specials, tournaments and get-togethers at TJ's Kitchen and Camarillo Springs.</p>
      </div>
    </section>
    <section class="section" style="padding-top:8px">
      <div class="wrap events-layout" data-events>
        <div class="cal" aria-label="Events calendar">
          <div class="cal-head">
            <button class="cal-nav" type="button" data-cal-prev aria-label="Previous month">‹</button>
            <h2 class="cal-title" data-cal-title>&nbsp;</h2>
            <button class="cal-nav" type="button" data-cal-next aria-label="Next month">›</button>
          </div>
          <div class="cal-grid cal-dow" aria-hidden="true"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
          <div class="cal-grid" data-cal-days></div>
        </div>
        <div>
          <h3 class="events-heading" data-events-heading>Coming up</h3>
          <div class="event-list" data-event-list><p class="muted">Loading events…</p></div>
        </div>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="wrap">
      <div>© <span data-year></span> TJ's Kitchen · <span data-address></span></div>
    </div>
  </footer>
</body>
</html>
