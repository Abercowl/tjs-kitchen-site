<!doctype html>
<!-- FILE:  tjs-kitchen-site/card.html
     tjs-kitchen-site/
     ├── card.html          <-- THIS FILE (new Nov 15 2026). Digital business card for
     │                      anyone on the team, at tjskitchenvc.com/card/<name>
     │                      (vercel.json rewrites /card/* here; /john forwards to
     │                      /card/john). The card's details come from Supabase
     │                      staff_cards -- add and edit cards in admin -> Website ->
     │                      Business cards. "Evergreen salon" look.
     │                      Save to contacts builds a vCard (.vcf) with the photo;
     │                      the QR code is drawn here, so every card has its own.
     │                      Nov 15 2026 (later): EVERY part is per-card -- logo,
     │                      name at the top, links (blank = hidden), address,
     │                      bottom line. Contact photo = headshot, else the logo.
     ├── assets/vendor/qrcode.js   QR code library (MIT, Kazuhiko Arase)
     └── john.html          removed -- /john now forwards to /card/john
     noindex: shared by link, QR or NFC tap, not found through search. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TJ's Kitchen · Digital business card</title>
  <meta name="description" content="TJ's Kitchen: private events, celebrations, corporate gatherings and special occasions in Camarillo, California.">
  <meta name="robots" content="noindex">
  <meta property="og:title" content="TJ's Kitchen · Digital business card">
  <meta property="og:description" content="Private events, celebrations, corporate gatherings and special occasions.">
  <meta property="og:image" content="https://tjskitchenvc.com/assets/contact-photo.jpg">
  <meta name="theme-color" content="#13291f">
  <link rel="icon" href="/assets/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css">
  <style>
    /* Evergreen salon: deep green, gold-foil logo, ivory type, fine gold rules. */
    html, body { background: #13291f; }
    body.vcard-page { margin: 0; min-height: 100vh; color: #f6f1e7; font-family: 'Jost', system-ui, sans-serif; }
    .vc { max-width: 440px; margin: 0 auto; padding: 44px 24px calc(40px + env(safe-area-inset-bottom)); box-sizing: border-box; text-align: center; }
    .vc-logo { width: 240px; max-width: 78%; height: auto; display: block; margin: 0 auto 20px; } /* larger, Nov 15 2026 */
    .vc-brand { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 2.3rem; font-weight: 500; line-height: 1; margin: 0; color: #f6f1e7; }
    .vc-caps { font-size: .72rem; font-weight: 500; letter-spacing: .3em; text-transform: uppercase; color: #c9a45c; margin: 10px 0 0; }
    .vc-rule { width: 44px; height: 1px; background: #c9a45c; margin: 26px auto; border: 0; }
    .vc .vc-name { color: #f6f1e7; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 2rem; font-weight: 500; margin: 0; line-height: 1.1; }
    .vc-title { font-size: .72rem; font-weight: 500; letter-spacing: .26em; text-transform: uppercase; color: #c9a45c; margin: 8px 0 0; }
    .vc-tag { font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-size: 1.15rem; color: #d9d1bf; margin: 18px 0 0; line-height: 1.4; }
    .vc-save { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 54px; margin: 28px 0 14px; border: 0; border-radius: 999px; background: #c9a45c; color: #13291f; font: 500 1rem 'Jost', system-ui, sans-serif; letter-spacing: .04em; cursor: pointer; text-decoration: none; }
    .vc-save:hover { background: #d8b878; }
    .vc-list { list-style: none; margin: 0; padding: 0; text-align: left; border-top: 1px solid rgba(201,164,92,.35); }
    .vc-list li { border-bottom: 1px solid rgba(201,164,92,.35); }
    .vc-list a { display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 6px 4px; color: #f6f1e7; text-decoration: none; }
    .vc-list a:hover .vc-v { color: #dcc189; }
    .vc-ic { width: 34px; height: 34px; flex: none; display: grid; place-items: center; border: 1px solid rgba(201,164,92,.55); border-radius: 50%; color: #c9a45c; }
    .vc-ic svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .vc-l { display: block; font-size: .66rem; letter-spacing: .22em; text-transform: uppercase; color: #a9a291; }
    .vc-v { display: block; font-size: 1rem; line-height: 1.3; word-break: break-word; }
    .vc-row { display: flex; gap: 10px; margin-top: 18px; }
    .vc-ghost { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border: 1px solid rgba(201,164,92,.6); border-radius: 999px; background: transparent; color: #f6f1e7; font: 500 .92rem 'Jost', system-ui, sans-serif; cursor: pointer; }
    .vc-ghost svg, .vc-save svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .vc-qr { margin: 22px auto 0; padding: 14px; background: #f6f1e7; border-radius: 14px; width: 220px; }
    .vc-qr img { width: 100%; height: auto; display: block; }
    .vc-qr p { margin: 8px 0 0; color: #13291f; font-size: .8rem; }
    .vc-foot { margin-top: 30px; font-size: .7rem; letter-spacing: .2em; text-transform: uppercase; color: #8f8a7c; }
    .vc-toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #f6f1e7; color: #13291f; padding: 10px 18px; border-radius: 999px; font-size: .9rem; box-shadow: 0 6px 20px rgba(0,0,0,.3); }
    .vc-photo { width: 116px; height: 116px; border-radius: 50%; object-fit: cover; display: block; margin: 0 auto 16px; border: 2px solid #c9a45c; }
    .vc-missing { padding-top: 30vh; }
    .vc-missing p { color: #d9d1bf; }
    .vc-missing a { color: #c9a45c; }
    .vc-qr svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body class="vcard-page">
  <main class="vc" id="vc" hidden>
    <img class="vc-logo" data-f="logo" src="/assets/logo-gold.png" alt="Logo" width="240" height="203">
    <p class="vc-brand" data-f="brand"></p>
    <p class="vc-caps" data-f="caps"></p>

    <hr class="vc-rule">

    <img class="vc-photo" data-f="photo" alt="" hidden>
    <h1 class="vc-name" data-f="name"></h1>
    <p class="vc-title" data-f="title"></p>
    <p class="vc-tag" data-f="tagline"></p>

    <button type="button" class="vc-save" data-vc-save>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path><path d="M19 3v6M16 6h6"></path></svg>
      Save to contacts
    </button>

    <ul class="vc-list">
      <li data-row="phone"><a data-vc-tel href="#">
        <span class="vc-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"></path></svg></span>
        <span><span class="vc-l">Call</span><span class="vc-v" data-f="phone"></span></span></a></li>
      <li data-row="email"><a data-vc-mail href="#">
        <span class="vc-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-10 6L2 7"></path></svg></span>
        <span><span class="vc-l">Email</span><span class="vc-v" data-f="email"></span></span></a></li>
      <li data-row="website"><a data-link="website" href="#">
        <span class="vc-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20"></path></svg></span>
        <span><span class="vc-l">Website</span><span class="vc-v" data-f="website"></span></span></a></li>
      <li data-row="order"><a data-link="order" href="#">
        <span class="vc-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><path d="M3 6h18M16 10a4 4 0 0 1-8 0"></path></svg></span>
        <span><span class="vc-l">Order online</span><span class="vc-v" data-f="order"></span></span></a></li>
      <li data-row="instagram"><a data-link="instagram" href="#" target="_blank" rel="noopener">
        <span class="vc-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.2" cy="6.8" r=".6"></circle></svg></span>
        <span><span class="vc-l">Instagram</span><span class="vc-v" data-f="instagram"></span></span></a></li>
      <li data-row="facebook"><a data-link="facebook" href="#" target="_blank" rel="noopener">
        <span class="vc-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 8h2.5V4.5H14A3.5 3.5 0 0 0 10.5 8v2.5H8V14h2.5v6.5H14V14h2.5l.5-3.5h-3V8z"></path></svg></span>
        <span><span class="vc-l">Facebook</span><span class="vc-v" data-f="facebook"></span></span></a></li>
    </ul>

    <div class="vc-row">
      <button type="button" class="vc-ghost" data-vc-share>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"></path><path d="m7 8 5-5 5 5"></path><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"></path></svg>
        Share
      </button>
      <button type="button" class="vc-ghost" data-vc-qr aria-expanded="false" aria-controls="vcQr">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"></path></svg>
        QR code
      </button>
    </div>
    <div class="vc-qr" id="vcQr" hidden>
      <div data-qr role="img" aria-label="QR code for this card"></div>
      <p>Scan to open this card</p>
    </div>

    <p class="vc-foot" data-f="footer"></p>
  </main>

  <main class="vc vc-missing" id="vcMissing" hidden>
    <p class="vc-brand">TJ's Kitchen</p>
    <p>This card isn't available.</p>
    <p><a href="/">Visit tjskitchenvc.com</a></p>
  </main>

  <script src="/assets/site.js"></script>
  <script src="/assets/vendor/qrcode.js"></script>
  <script>
    // Card page (Nov 15 2026). Which card: /card/<slug>, or ?c=<slug> (admin preview).
    (function () {
      const qs = new URLSearchParams(location.search);
      const m = location.pathname.match(/^\/card\/([a-z0-9-]+)\/?$/i);
      const slug = ((qs.get('c') || (m && m[1]) || '') + '').toLowerCase();
      const CARD_URL = 'https://tjskitchenvc.com/card/' + slug;
      const $ = s => document.querySelector(s);
      const digits = s => (s || '').replace(/[^\d+]/g, '');
      const telOf = s => { const d = digits(s); return d.length === 10 ? '+1' + d : d; };
      const toast = msg => { const t = document.createElement('div'); t.className = 'vc-toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); };
      let card = null, photo = '';

      function missing() { $('#vcMissing').hidden = false; }

      async function load() {
        if (!/^[a-z0-9][a-z0-9-]{1,39}$/.test(slug)) return missing();
        let rows = [];
        try { rows = await sb('staff_cards?select=slug,name,title,phone,email,caps,tagline,photo_url,logo_url,brand,website_url,order_url,instagram,facebook_url,address,footer&slug=eq.' + encodeURIComponent(slug)); }
        catch (e) { return missing(); }
        if (!rows || !rows.length) return missing();
        card = rows[0];
        const brand = card.brand || 'TJ\'s Kitchen';
        document.title = card.name + ' · ' + brand;
        const set = (f, v) => { const el = $('[data-f="' + f + '"]'); el.textContent = v || ''; el.hidden = !v; };
        set('caps', card.caps); set('name', card.name); set('title', card.title); set('tagline', card.tagline);
        set('phone', card.phone); set('email', card.email);
        set('brand', card.brand); set('footer', card.footer);
        const logo = $('[data-f="logo"]');
        logo.src = /^https:\/\//i.test(card.logo_url || '') ? card.logo_url : '/assets/logo-gold.png';
        logo.alt = brand + ' logo';
        // Links: blank = that row is hidden.
        const web = u => /^https?:\/\//i.test(u || '') ? u : '';
        const short = u => u.replace(/^https?:\/\/(www\.)?/i, '').replace(/\/$/, '');
        const links = {
          website: web(card.website_url), order: web(card.order_url), facebook: web(card.facebook_url),
          instagram: /^[A-Za-z0-9._]{1,30}$/.test(card.instagram || '') ? 'https://instagram.com/' + card.instagram : ''
        };
        Object.keys(links).forEach(k => {
          $('[data-row="' + k + '"]').hidden = !links[k];
          if (!links[k]) return;
          $('[data-link="' + k + '"]').href = links[k];
          set(k, k === 'instagram' ? '@' + card.instagram : k === 'facebook' ? brand : short(links[k]));
        });
        card._links = links;
        $('[data-row="phone"]').hidden = !card.phone;
        $('[data-row="email"]').hidden = !card.email;
        $('[data-vc-tel]').href = 'tel:' + telOf(card.phone);
        $('[data-vc-mail]').href = 'mailto:' + card.email;
        const ph = $('[data-f="photo"]');
        if (/^https:\/\//i.test(card.photo_url || '')) { ph.src = card.photo_url; ph.alt = card.name; ph.hidden = false; } else ph.hidden = true;
        // QR code for this card's own address.
        try {
          const q = qrcode(0, 'M'); q.addData(CARD_URL); q.make();
          $('[data-qr]').innerHTML = q.createSvgTag({ cellSize: 6, margin: 2, scalable: true }).replace(/fill="black"/g, 'fill="#13291f"').replace(/fill="white"/g, 'fill="#f6f1e7"');
        } catch (e) { $('[data-vc-qr]').hidden = true; }
        $('#vc').hidden = false;
        // Contact photo: their headshot, else this card's logo on the card's
        // green, as a JPEG. Made ahead of time so Save is instant.
        const usePhoto = /^https:\/\//i.test(card.photo_url || '');
        const im = new Image(); im.crossOrigin = 'anonymous';
        im.onload = () => {
          try {
            const S = 600, c = document.createElement('canvas'); c.width = c.height = S;
            const x = c.getContext('2d');
            if (usePhoto) {
              const k = Math.max(S / im.width, S / im.height), w = im.width * k, h = im.height * k;
              x.drawImage(im, (S - w) / 2, (S - h) / 2, w, h);
            } else {
              x.fillStyle = '#13291f'; x.fillRect(0, 0, S, S);
              const k = Math.min(S * 0.86 / im.width, S * 0.86 / im.height), w = im.width * k, h = im.height * k;
              x.drawImage(im, (S - w) / 2, (S - h) / 2, w, h);
            }
            photo = c.toDataURL('image/jpeg', 0.82).split(',')[1] || '';
          } catch (e) { photo = ''; }
        };
        im.src = usePhoto ? card.photo_url : logo.src;
      }

      // vCard 3.0 (iPhone + Android). Lines folded at 75 characters.
      const esc = s => (s || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/([,;])/g, '\\$1');
      const fold = line => line.length <= 75 ? line : line.match(/.{1,74}/g).join('\r\n ');
      $('[data-vc-save]').addEventListener('click', () => {
        if (!card) return;
        const parts = card.name.trim().split(/\s+/);
        const last = parts.length > 1 ? parts.pop() : '';
        const first = parts.join(' ');
        const lines = [
          'BEGIN:VCARD', 'VERSION:3.0',
          'N:' + esc(last) + ';' + esc(first) + ';;;',
          'FN:' + esc(card.name),
          'ORG:' + esc(card.brand || 'TJ\'s Kitchen'),
          card.title ? 'TITLE:' + esc(card.title) : '',
          card.phone ? 'TEL;TYPE=WORK,VOICE:' + telOf(card.phone) : '',
          card.email ? 'EMAIL;TYPE=INTERNET,WORK:' + card.email : '',
          card._links.website ? 'item1.URL:' + card._links.website : '', card._links.website ? 'item1.X-ABLabel:Website' : '',
          card._links.order ? 'item2.URL:' + card._links.order : '', card._links.order ? 'item2.X-ABLabel:Order online' : '',
          card._links.instagram ? 'X-SOCIALPROFILE;TYPE=instagram:' + card._links.instagram : '',
          card._links.facebook ? 'X-SOCIALPROFILE;TYPE=facebook:' + card._links.facebook : '',
          card.address ? 'ADR;TYPE=WORK:;;' + esc(card.address) + ';;;;' : '',
          card.tagline ? 'NOTE:' + esc(card.tagline) : '',
          photo ? 'PHOTO;ENCODING=b;TYPE=JPEG:' + photo : '',
          'END:VCARD'
        ].filter(Boolean).map(fold).join('\r\n');
        const blob = new Blob([lines + '\r\n'], { type: 'text/vcard;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = ((first || card.name) + ' ' + (card.brand || 'TJs Kitchen')).replace(/[^\w-]+/g, '-') + '.vcf';
        document.body.appendChild(a); a.click();
        setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      });

      $('[data-vc-share]').addEventListener('click', async () => {
        if (!card) return;
        try {
          if (navigator.share) { await navigator.share({ title: card.name + ' · ' + (card.brand || 'TJ\'s Kitchen'), url: CARD_URL }); return; }
          await navigator.clipboard.writeText(CARD_URL); toast('Link copied');
        } catch (e) { /* closed the share sheet */ }
      });

      const qrBtn = $('[data-vc-qr]'), qr = $('#vcQr');
      qrBtn.addEventListener('click', () => {
        qr.hidden = !qr.hidden; qrBtn.setAttribute('aria-expanded', String(!qr.hidden));
        if (!qr.hidden) qr.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });

      load();
    })();
  </script>
</body>
</html>
