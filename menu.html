<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu | TJ's Kitchen</title>
  <meta name="description" content="TJ's Kitchen at Camarillo Springs Golf Course — order ahead for pick-up or delivery to your hole.">
  <meta property="og:title" content="Menu | TJ's Kitchen">
  <meta property="og:description" content="TJ's Kitchen at Camarillo Springs Golf Course — order ahead for pick-up or delivery to your hole.">
  <meta property="og:image" content="/assets/logo.png">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="/assets/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/site.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/"><img src="/assets/logo.png" alt="TJ's Kitchen logo"><span>TJ's Kitchen</span></a>
      <button class="menu-toggle" aria-label="Open menu">☰</button>
      <nav class="nav">
        <a href="/">Home</a>
        <a href="/menu" class="active" aria-current="page">Menu</a>
        <a href="/about">About</a>
        <a href="/contact">Contact</a>
        <a class="btn btn-sm" data-order-link href="https://order.tjskitchenvc.com">Order Online</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section" style="padding-bottom:24px">
      <div class="wrap">
        <div class="eyebrow">Menu</div>
        <h1>Today's Menu</h1>
        <p class="lead" style="margin-top:10px">This menu updates live, so what you see here is what we're serving today.</p>
        <div class="ready-line"><span>Ready to eat?</span><a class="btn btn-sm" data-order-link href="https://order.tjskitchenvc.com">Order Now</a></div>
      </div>
    </section>
    <nav class="cat-tabs" aria-label="Menu sections"><div class="wrap" id="cat-tabs"></div></nav>
    <div class="wrap" id="menu-root" style="padding-bottom:64px"><div class="menu-status">Loading the menu…</div></div>

  </main>

  <footer class="site-footer">
    <div class="wrap">
      <div>© <span data-year></span> TJ's Kitchen · <span data-address></span></div>
      <div class="footer-links">
        <a href="/menu">Menu</a><a href="/about">About</a><a href="/contact">Contact</a><a data-order-link href="https://order.tjskitchenvc.com">Order Online</a>
      </div>
    </div>
  </footer>
</body>
</html>
