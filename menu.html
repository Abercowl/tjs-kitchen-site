<!DOCTYPE html>
<!-- FILE:  tjs-kitchen-site/menu.html
     tjs-kitchen-site/
     ├── menu.html   <-- THIS FILE (Menu (live from the admin); text and pictures editable in the admin portal -> Website)
     └── assets/
         ├── site.js
         └── style.css -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu | TJ's Kitchen</title>
  <meta name="description" content="TJ's Kitchen at Camarillo Springs Golf Course — order ahead for pick-up or delivery to your hole.">
  <meta property="og:title" content="Menu | TJ's Kitchen">
  <meta property="og:description" content="TJ's Kitchen at Camarillo Springs Golf Course — order ahead for pick-up or delivery to your hole.">
  <meta property="og:image" content="/assets/logo.png">
  <meta name="theme-color" content="#1c3a2e">
  <link rel="icon" href="/assets/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Lobster&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/site.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/"><img src="/assets/logo-light.png" alt="TJ's Kitchen logo"><span>TJ's Kitchen</span></a>
      <button class="menu-toggle" aria-label="Open menu"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg></button>
      <nav class="nav">
        <a href="/">Home</a>
        <a href="/menu" class="active" aria-current="page">Menu</a>
        <a href="/about">About</a>
        <a href="/events">Specials &amp; Events</a>
        <a href="/contact">Contact</a>
        <a class="btn btn-sm" data-order-link href="https://order.tjskitchenvc.com">Order Online</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section" style="padding-bottom:24px">
      <div class="wrap">
        <h1 data-edit="menu.title" data-edit-label="Menu: big headline">Today's Menu</h1>
        <p class="lead" style="margin-top:10px" data-edit="menu.lead" data-edit-label="Menu: intro line" data-edit-long>This menu updates live, so what you see here is what we're serving today.</p>
        <div class="ready-line"><span data-edit="menu.ready" data-edit-label="Menu: Ready to eat line">Ready to eat?</span><a class="btn btn-sm" data-order-link href="https://order.tjskitchenvc.com"><span data-edit="menu.btn_order" data-edit-label="Menu: Order button">Order Now</span></a></div>
      </div>
    </section>
    <nav class="cat-tabs" aria-label="Menu sections"><div class="wrap" id="cat-tabs"></div></nav>
    <div class="wrap" id="menu-root" style="padding-bottom:64px"><div class="menu-status">Loading the menu…</div></div>

  </main>

  <footer class="site-footer">
    <div class="wrap">
      <div>© <span data-year></span> TJ's Kitchen · <span data-address></span></div>
    </div>
  </footer>
</body>
</html>
